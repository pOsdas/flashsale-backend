services:
  postgres:
    image: postgres:17-alpine
    container_name: flashsale_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}

      POSTGRES_EXPORTER_USER: ${POSTGRES_EXPORTER_USER}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD}
    volumes:
      - flashsale_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: flashsale_postgres_exporter
    command:
      - --collector.stat_checkpointer
    environment:
      DATA_SOURCE_NAME: >-
        postgresql://${POSTGRES_EXPORTER_USER}:${POSTGRES_EXPORTER_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: flashsale_redis

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: flashsale_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:15672:15672"
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_management rabbitmq_prometheus &&
             rabbitmq-server"

  redis_exporter:
    image: oliver006/redis_exporter:v1.86.0
    container_name: flashsale_redis_exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  vpn_controller:
    build:
      context: ./go_fetcher/internal
      dockerfile: vpn_controller/Dockerfile
    container_name: flashsale_vpn_controller
    init: true
    environment:
      VPN_SUBSCRIPTIONS_PATH: /app/secrets/subscriptions.json
      VPN_PROFILES_PATH: /app/vpn_controller/vpn_profiles.json
      VPN_STATE_PATH: /app/state/latest-preflight.json
      VPN_RUNS_DIR: /app/state/runs
      VPN_PREFLIGHT_INTERVAL_SECONDS: "3600"
      VPN_PARSE_DELAY_SECONDS: "0"  # prod = 600
      VPN_PREFLIGHT_ATTEMPTS: "3"
      VPN_PREFLIGHT_MIN_SUCCESSES: "2"
      VPN_PREFLIGHT_PARALLELISM: "2"
      VPN_XRAY_START_TIMEOUT_SECONDS: "20"
      VPN_PROBE_TIMEOUT_SECONDS: "10"
      VPN_MAX_PROFILES_PER_GROUP: "3"
      VPN_RETAINED_RUNS: "5"
      VPN_RUN_PREFLIGHT_ON_START: "true"
      VPN_GATEWAY_ENABLED: "true"
      VPN_REQUIRE_PARSE_READY: "true"
      VPN_PARSE_PROXY_PORT: "10808"
      VPN_PARSE_PROXY_PUBLIC_HOST: vpn_controller
      VPN_PARSE_WORKER_TIMEOUT_SECONDS: "120"
      VPN_PARSE_ATTEMPT_TIMEOUT_SECONDS: "150"
      VPN_ACTIVE_SESSION_IDLE_SECONDS: "1200"
      VPN_MARKETPLACE_REJECTION_CONFIRMATIONS: "2"
      VPN_OZON_BROWSER_URL: http://ozon_browser_fetcher:8095
      VPN_WB_BROWSER_URL: http://wb_browser_fetcher:8096
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./go_fetcher/secrets:/app/secrets:ro
      - flashsale_vpn_controller_state:/app/state
    expose:
      - "8097"
      - "10808"
    depends_on:
      wb_browser_fetcher:
        condition: service_healthy
      ozon_browser_fetcher:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/api/v1/health', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s

  go_fetcher:
    build:
      context: ./go_fetcher
      dockerfile: Dockerfile
    container_name: flashsale_go_fetcher
    env_file:
      - ./go_fetcher/.env
    environment:
      WB_BROWSER_FETCHER_URL: http://vpn_controller:8097
      OZON_BROWSER_FETCHER_URL: http://vpn_controller:8097
    volumes:
      - ./go_fetcher/secrets:/app/secrets:ro
    command: ["serve"]
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      vpn_controller:
        condition: service_healthy
    restart: unless-stopped

  ozon_browser_fetcher:
    platform: linux/amd64
    build:
      context: ./go_fetcher/internal
      dockerfile: ozon_browser_fetcher/Dockerfile
    container_name: flashsale_ozon_browser_fetcher
    environment:
      OZON_COOKIE_PATH: /app/secrets/ozon_cookie.txt

      BROWSER_PROFILE_RETENTION: "20"
      BROWSER_PROFILE_CACHE_CLEANUP_INTERVAL_HOURS: "24"
      BROWSER_PROFILE_MAX_TOTAL_MB: "1024"
      BROWSER_REQUIRE_PROXY: "true"
      BROWSER_HEADLESS: "false"
      BROWSER_START_TIMEOUT_SECONDS: "30"
      OZON_BROWSER_CDP_START_TIMEOUT_SECONDS: "25"
      OZON_BROWSER_CDP_CONNECT_TIMEOUT_MS: "10000"
      OZON_BROWSER_DIAGNOSTICS_DIR: "/tmp/ozon-parser-diagnostics"
      OZON_BROWSER_DIAGNOSTICS_MAX_SETS: "10"
      OZON_BROWSER_DIAGNOSTICS_MAX_AGE_HOURS: "72"
      OZON_BROWSER_DIAGNOSTICS_MAX_TOTAL_MB: "100"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ozon_browser_profile:/data/browser-profile
      - ./go_fetcher/secrets:/app/secrets:ro
    ports:
      - "127.0.0.1:8095:8095"
    shm_size: "1gb"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/api/v1/health', timeout=5)\"" ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  wb_browser_fetcher:
    platform: linux/amd64
    build:
      context: ./go_fetcher/internal
      dockerfile: wb_browser_fetcher/Dockerfile
    container_name: flashsale_wb_browser_fetcher
    environment:
      WB_COOKIE_PATH: /app/secrets/wb_cookie.txt

      BROWSER_PROFILE_RETENTION: "20"
      BROWSER_PROFILE_CACHE_CLEANUP_INTERVAL_HOURS: "24"
      BROWSER_PROFILE_MAX_TOTAL_MB: "1024"
      BROWSER_REQUIRE_PROXY: "true"
      BROWSER_HEADLESS: "false"
      BROWSER_START_TIMEOUT_SECONDS: "30"
      WB_BROWSER_CDP_START_TIMEOUT_SECONDS: "25"
      WB_BROWSER_CDP_CONNECT_TIMEOUT_MS: "10000"
      WB_BROWSER_READY_TIMEOUT_MS: "25000"
      WB_BROWSER_READY_POLL_INTERVAL_MS: "500"
      WB_BROWSER_POST_READY_DELAY_MS: "2000"
      WB_BROWSER_RECOVERY_DELAY_MS: "6000"
      WB_BROWSER_DIAGNOSTICS_DIR: "/tmp/wb-browser-diagnostics"
      WB_BROWSER_DIAGNOSTICS_MAX_SETS: "10"
      WB_BROWSER_DIAGNOSTICS_MAX_AGE_HOURS: "72"
      WB_BROWSER_DIAGNOSTICS_MAX_TOTAL_MB: "100"
      PYTHONUNBUFFERED: "1"
    volumes:
      - wb_browser_profile:/data/browser-profile
      - ./go_fetcher/secrets:/app/secrets:ro
    ports:
      - "127.0.0.1:8096:8096"
    shm_size: "1gb"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/api/v1/health', timeout=5)\"" ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flashsale_migrate
    env_file:
      - ./backend/.env.docker
    command: >
      sh -c "python ensure_db.py"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flashsale_backend
    env_file:
      - ./backend/.env.docker
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  outbox_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flashsale_outbox_worker
    env_file:
      - ./backend/.env.docker
    command: >
      sh -c "python manage.py run_outbox_worker"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  monitoring_scanner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flashsale_monitoring_scanner
    env_file:
      - ./backend/.env.docker
    command: >
      sh -c "python manage.py run_monitoring_scanner"
    expose:
      - "8012"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      go_fetcher:
        condition: service_started

  notification_consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flashsale_notification_consumer
    env_file:
      - ./backend/.env.docker
    command: > 
      sh -c "python manage.py run_notification_consumer"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    ports:
      - "127.0.0.1:8011:8011"
    restart: unless-stopped

  telegram_bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flashsale_telegram_bot
    env_file:
      - ./backend/.env.docker
    command: >
      sh -c "python manage.py run_telegram_onboarding_bot"
    expose:
      - "8013"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.3
    container_name: flashsale_cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

  blackbox_exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    container_name: flashsale_blackbox_exporter
    command:
      - --config.file=/config/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/config/blackbox.yml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: flashsale_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - flashsale_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      outbox_worker:
        condition: service_started
      notification_consumer:
        condition: service_started
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    container_name: flashsale_loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - flashsale_loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: grafana/promtail:3.3.2
    container_name: flashsale_promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    container_name: flashsale_grafana
    env_file:
      - ./backend/.env.docker
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - flashsale_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

volumes:
  flashsale_postgres_data:
  flashsale_grafana_data:
  flashsale_loki_data:
  flashsale_prometheus_data:
  ozon_browser_profile:
  wb_browser_profile:
  flashsale_vpn_controller_state:
