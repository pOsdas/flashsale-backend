    labels:
      severity: warning
      service: redis
      category: application
    isPaused: false
  - uid: flashsale_redis_evictions
    title: Redis Key Evictions Detected
    condition: C
    data:
    - refId: A
      datasourceUid: Prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        expr: sum(increase(redis_evicted_keys_total{job="redis"}[10m])) or vector(0)
        refId: A
        instant: true
        range: false
    - refId: B
