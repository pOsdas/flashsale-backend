          query:
            params:
            - C
          reducer:
            type: last
          type: query
        refId: C
    noDataState: OK
    execErrState: Error
    for: 2m
    annotations:
      summary: PostgreSQL недоступен exporter
      description: PostgreSQL exporter не может успешно выполнить запрос к базе данных.
    labels:
      severity: critical
      service: postgres
      category: application
    isPaused: false
  - uid: flashsale_postgres_deadlocks
    title: PostgreSQL Deadlocks Detected
    condition: C
    data:
    - refId: A
      datasourceUid: Prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        expr: sum(increase(pg_stat_database_deadlocks{job="postgres",datname="flashsale"}[15m])) or vector(0)
        refId: A
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
