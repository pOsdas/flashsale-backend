    labels:
      severity: warning
      service: redis
      category: application
    isPaused: false
  - uid: flashsale_postgres_unavailable
    title: PostgreSQL Exporter Cannot Reach Database
    condition: C
    data:
    - refId: A
      datasourceUid: Prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        expr: |-
          (max(pg_up{job="postgres"}) == bool 0)
          or absent(pg_up{job="postgres"})
        refId: A
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
