        expr: max(redis_blocked_clients{job="redis"}) or vector(0)
        refId: A
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
          type: query
        refId: C
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: В Redis есть заблокированные клиенты
