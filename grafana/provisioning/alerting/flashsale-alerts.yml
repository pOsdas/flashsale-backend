        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
          type: query
        refId: C
    noDataState: OK
    execErrState: Error
    for: 1m
    annotations:
      summary: В PostgreSQL обнаружены deadlock
      description: За последние 15 минут база flashsale зарегистрировала минимум один deadlock.
    labels:
      severity: warning
      service: postgres
      category: application
    isPaused: false

- orgId: 1
  name: Flashsale VPN parsing alerts
  folder: Flashsale
  interval: 30s
  rules:
  - uid: flashsale_vpn_group_suspected
    title: VPN IP Group Requires Manual Marketplace Check
    condition: C
    data:
    - refId: A
      datasourceUid: Prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        expr: max by (marketplace, exit_ip) (vpn_group_suspected_rejection{job="vpn_controller"}) or vector(0)
        refId: A
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.5
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
          type: query
        refId: C
    noDataState: OK
    execErrState: Error
    for: 1m
    annotations:
      summary: VPN IP-группа не прошла парсинг через несколько профилей
      description: 'IP-группа {{ $labels.exit_ip }} не прошла парсинг {{ $labels.marketplace }} минимум через два разных профиля с подтверждённым выходным IP. Требуется ручная проверка; автоматическая блокировка IP не утверждается.'
    labels:
      severity: warning
      service: vpn_controller
      category: marketplace_access
    isPaused: false
  - uid: flashsale_vpn_group_unavailable
    title: VPN Profile Group Unavailable
    condition: C
    data:
    - refId: A
      datasourceUid: Prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        expr: |-
          sum by (marketplace, exit_ip, reason) (
            increase(vpn_group_parse_exhausted_total{
              job="vpn_controller",
              reason=~"vpn_group_unavailable|mixed_persistent_failures"
            }[5m])
          ) or vector(0)
        refId: A
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
          type: query
        refId: C
    noDataState: OK
    execErrState: Error
    for: 1m
    annotations:
      summary: VPN IP-группа не предоставила стабильный маршрут
      description: 'Группа {{ $labels.exit_ip }} для {{ $labels.marketplace }} исчерпана. Причина: {{ $labels.reason }}. Это инфраструктурная или смешанная ошибка и не является подтверждением блокировки IP.'
    labels:
      severity: warning
      service: vpn_controller
      category: vpn_route
    isPaused: false
