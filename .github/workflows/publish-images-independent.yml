name: Publish Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect changed images
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build image matrix
        id: matrix
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MATRIX='[
              {
                "image": "flashsale-backend",
                "context": "./backend",
                "dockerfile": "./backend/Dockerfile"
              },
              {
                "image": "flashsale-go-fetcher",
                "context": "./go_fetcher",
                "dockerfile": "./go_fetcher/Dockerfile"
              },
              {
                "image": "flashsale-ozon-browser-fetcher",
                "context": "./go_fetcher/internal",
                "dockerfile": "./go_fetcher/internal/ozon_browser_fetcher/Dockerfile"
              },
              {
                "image": "flashsale-wb-browser-fetcher",
                "context": "./go_fetcher/internal",
                "dockerfile": "./go_fetcher/internal/wb_browser_fetcher/Dockerfile"
              },
              {
                "image": "flashsale-vpn-controller",
                "context": "./go_fetcher/internal",
                "dockerfile": "./go_fetcher/internal/vpn_controller/Dockerfile"
              },
              {
                "image": "flashsale-grafana",
                "context": "./grafana",
                "dockerfile": "./grafana/Dockerfile"
              }
            ]'

            echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)

          MATRIX='[]'

          if echo "$CHANGED_FILES" | grep -q '^backend/'; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + [{
              "image": "flashsale-backend",
              "context": "./backend",
              "dockerfile": "./backend/Dockerfile"
            }]')
          fi

          if echo "$CHANGED_FILES" | grep -q '^go_fetcher/'; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + [{
              "image": "flashsale-go-fetcher",
              "context": "./go_fetcher",
              "dockerfile": "./go_fetcher/Dockerfile"
            }]')
          fi

          if echo "$CHANGED_FILES" | grep -q '^go_fetcher/internal/ozon_browser_fetcher/'; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + [{
              "image": "flashsale-ozon-browser-fetcher",
              "context": "./go_fetcher/internal",
              "dockerfile": "./go_fetcher/internal/ozon_browser_fetcher/Dockerfile"
            }]')
          fi

          if echo "$CHANGED_FILES" | grep -q '^go_fetcher/internal/wb_browser_fetcher/'; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + [{
              "image": "flashsale-wb-browser-fetcher",
              "context": "./go_fetcher/internal",
              "dockerfile": "./go_fetcher/internal/wb_browser_fetcher/Dockerfile"
            }]')
          fi

          if echo "$CHANGED_FILES" | grep -q '^go_fetcher/internal/vpn_controller/'; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + [{
              "image": "flashsale-vpn-controller",
              "context": "./go_fetcher/internal",
              "dockerfile": "./go_fetcher/internal/vpn_controller/Dockerfile"
            }]')
          fi

          if echo "$CHANGED_FILES" | grep -q '^grafana/'; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + [{
              "image": "flashsale-grafana",
              "context": "./grafana",
              "dockerfile": "./grafana/Dockerfile"
            }]')
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.image }}
    needs:
      - changes

    if: needs.changes.outputs.matrix != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/posdas/${{ matrix.image }}:latest
            ghcr.io/posdas/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}